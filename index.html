<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e10" />
    <script>
      (function () {
        var t = 'dark'
        try {
          if (localStorage.getItem('theme') === 'light') t = 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', t)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'light' ? '#edf0f4' : '#0d0e10')
      })()
    </script>
    <title>Reza Galang Kurniawan — Software Engineer</title>
    <meta
      name="description"
      content="Portofolio Reza Galang Kurniawan, Software Engineer di Sidoarjo. Pengembangan aplikasi web Laravel, REST API, Flutter, dan pengelolaan server Linux."
    />
    <meta property="og:title" content="Reza Galang Kurniawan — Software Engineer" />
    <meta
      property="og:description"
      content="Aplikasi web Laravel, REST API, Flutter, dan server Linux. Lihat proyek dan pengalaman kerja."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
